<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face to Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section id="home">
      <p>AN EXPERIMENT IN IDENTITY</p>
      <h1>FACE<br>TO NAME.</h1>
      <p>What would your face be called?</p>
      <button id="startBtn">START SCANNING →</button>
    </section>

    <section id="scanner" hidden>
      <h2>YOUR FACE, YOUR NAME.</h2>
      <p>Look into the camera to begin.</p>
      <video id="camera" autoplay playsinline muted></video>
      <p id="status"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
